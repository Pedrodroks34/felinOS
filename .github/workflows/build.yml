name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential qemu-system-x86

      # -m32 is only needed for the 32-bit user program, but it is part of
      # what the build has to keep compiling.
      - name: Build
        run: make -j"$(nproc)"

      # The tree is expected to build without warnings, so they are errors
      # here rather than noise in a log nobody reads.
      - name: Rebuild and fail on warnings
        run: |
          make clean
          make -j"$(nproc)" 2>&1 | tee build.log
          if grep -qE 'warning:|error:' build.log; then
            echo "::error::the build produced warnings"
            grep -E 'warning:|error:' build.log
            exit 1
          fi

      - name: Test
        run: make test
